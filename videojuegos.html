<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videojuegos y Consolas | KAIO-STORE</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Manrope:wght@200;300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />

    <script src="js/config.js"></script>
    <script src="js/seo.js"></script>
</head>
<body class="bg-surface text-on-surface font-body">

    <div id="header-container"></div>

    <main>
        <section class="section-hero relative overflow-hidden">
            <img src="vj-hero-bg.jpg" alt="" aria-hidden="true" class="absolute inset-0 w-full h-full object-cover opacity-30" />
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#0c0c1f]/70 to-[#0c0c1f]"></div>
            <div class="relative max-w-7xl mx-auto px-6 py-28">
                <p class="font-label text-[10px] uppercase tracking-[0.4em] text-secondary">Gaming Hub — KAIO Store</p>
                <h1 class="font-headline text-7xl md:text-9xl font-black uppercase tracking-tighter mt-3 leading-[0.85]">
                    Prepárate para el<br/>
                    <span class="text-primary italic">nivel final</span>
                </h1>
                <p class="font-body text-lg text-on-surface-variant max-w-2xl mt-6">Consolas, títulos físicos y accesorios de última generación. Tu próxima aventura empieza acá.</p>

                <div class="flex flex-wrap gap-3 mt-8">
                    <a href="#catalogo" class="bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed px-7 py-4 font-headline font-black uppercase tracking-widest text-sm hover:shadow-[0_0_30px_rgba(255,144,106,0.5)] transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined text-base">sports_esports</span>
                        Explorar catálogo
                    </a>
                    <a href="ofertas.html" class="border border-secondary text-secondary px-7 py-4 font-headline font-black uppercase tracking-widest text-sm hover:bg-secondary hover:text-on-secondary transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined text-base">local_offer</span>
                        Ver ofertas
                    </a>
                </div>

                <div class="grid grid-cols-3 gap-4 mt-12 max-w-2xl border-t border-outline-variant/20 pt-8">
                    <div>
                        <p class="font-headline text-4xl md:text-5xl font-black text-primary">+200</p>
                        <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mt-1">Títulos</p>
                    </div>
                    <div>
                        <p class="font-headline text-4xl md:text-5xl font-black text-secondary">5</p>
                        <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mt-1">Plataformas</p>
                    </div>
                    <div>
                        <p class="font-headline text-4xl md:text-5xl font-black text-tertiary">24h</p>
                        <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mt-1">Envío express</p>
                    </div>
                </div>
            </div>
        </section>

        <span id="catalogo"></span>

        <section class="max-w-7xl mx-auto px-6 py-16">
            <div class="filter-container flex flex-wrap gap-2 mb-8">
                <button class="filter-chip filter-chip-active px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="all">Todo</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="playstation">PlayStation</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="nintendo">Nintendo</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="xbox">Xbox</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="pc">PC</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="accesorios">Accesorios</button>
            </div>
            <div class="catalog-grid grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </section>
    </main>

    <div id="footer-container"></div>
    <div id="cart-container"></div>
    <div id="whatsapp-container"></div>

    <script src="js/products-data.js?v=20260503-1"></script>
    <script src="js/catalog.js?v=20260509-1"></script>
    <script src="js/cart.js?v=20260509-1"></script>
    <script src="js/ui.js?v=20260509-1"></script>
    <script src="js/supabase-store.js?v=20260509-1"></script>
    <script src="js/components.js?v=20260423-1"></script>
</body>
</html>
