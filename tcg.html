<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro TCG | KAIO-STORE</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Manrope:wght@200;300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />

    <script src="js/config.js"></script>
    <script src="js/seo.js"></script>
</head>
<body class="bg-surface text-on-surface font-body">

    <div id="header-container"></div>

    <main>
        <section class="section-hero relative overflow-hidden" style="background:radial-gradient(ellipse at center,#2a1a4a 0%,#0c0c1f 70%);">
            <!-- Collage de cartas decorativo -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none opacity-70">
                <img src="category-images/tcg-pokemon-card.webp" alt="" aria-hidden="true" class="hidden md:block absolute left-[8%] top-1/2 -translate-y-1/2 w-40 -rotate-12 drop-shadow-[0_10px_30px_rgba(0,0,0,0.6)]" onerror="this.style.display='none'" />
                <img src="category-images/tcg-digimon-card.webp" alt="" aria-hidden="true" class="hidden md:block absolute left-[22%] top-1/2 -translate-y-1/2 w-44 -rotate-6 drop-shadow-[0_10px_30px_rgba(0,0,0,0.6)]" onerror="this.style.display='none'" />
                <img src="category-images/tcg-yugioh-card.webp" alt="" aria-hidden="true" class="hidden md:block absolute left-[36%] top-1/2 -translate-y-1/2 w-52 drop-shadow-[0_10px_40px_rgba(0,0,0,0.7)]" onerror="this.style.display='none'" />
                <img src="category-images/tcg-onepiece-card.webp" alt="" aria-hidden="true" class="hidden md:block absolute right-[28%] top-1/2 -translate-y-1/2 w-48 rotate-3 drop-shadow-[0_10px_30px_rgba(0,0,0,0.6)]" onerror="this.style.display='none'" />
                <img src="category-images/tcg-magic-card.webp" alt="" aria-hidden="true" class="hidden md:block absolute right-[10%] top-1/2 -translate-y-1/2 w-40 rotate-12 drop-shadow-[0_10px_30px_rgba(0,0,0,0.6)]" onerror="this.style.display='none'" />
            </div>
            <div class="absolute inset-0 bg-gradient-to-b from-[#0c0c1f]/60 via-transparent to-[#0c0c1f]"></div>

            <div class="relative max-w-7xl mx-auto px-6 py-28 md:py-36 text-center">
                <span class="inline-block bg-primary text-on-primary-fixed px-4 py-1.5 font-headline font-black text-[10px] uppercase tracking-[0.3em] mb-6">Trading Card Games</span>
                <h1 class="font-headline text-7xl md:text-[10rem] font-black uppercase tracking-tighter leading-[0.85] text-on-surface drop-shadow-[0_0_40px_rgba(255,255,255,0.15)]">
                    Centro <span class="italic">TCG</span>
                </h1>
                <p class="font-body text-lg text-on-surface-variant mt-6 max-w-3xl mx-auto">
                    Pokémon <span class="text-secondary">·</span> Magic <span class="text-secondary">·</span> Yu-Gi-Oh! <span class="text-secondary">·</span> One Piece <span class="text-secondary">·</span> Digimon <span class="text-secondary">y más</span>
                </p>
            </div>
        </section>

        <!-- Categorías destacadas TCG -->
        <section class="max-w-7xl mx-auto px-6 py-12">
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                <div class="aspect-square bg-surface-container hover:bg-surface-container-high transition-all p-4 flex flex-col justify-between cursor-pointer group" data-tcg-shortcut="pokemon">
                    <img src="category-images/tcg-pokemon.svg" alt="Pokémon" class="w-12 h-12" />
                    <p class="font-headline font-black uppercase text-sm group-hover:text-primary transition-colors">Pokémon</p>
                </div>
                <div class="aspect-square bg-surface-container hover:bg-surface-container-high transition-all p-4 flex flex-col justify-between cursor-pointer group" data-tcg-shortcut="yugioh">
                    <img src="category-images/tcg-yugioh.svg" alt="Yu-Gi-Oh!" class="w-12 h-12" />
                    <p class="font-headline font-black uppercase text-sm group-hover:text-primary transition-colors">Yu-Gi-Oh!</p>
                </div>
                <div class="aspect-square bg-surface-container hover:bg-surface-container-high transition-all p-4 flex flex-col justify-between cursor-pointer group" data-tcg-shortcut="magic">
                    <img src="category-images/tcg-magic.svg" alt="Magic" class="w-12 h-12" />
                    <p class="font-headline font-black uppercase text-sm group-hover:text-primary transition-colors">Magic</p>
                </div>
                <div class="aspect-square bg-surface-container hover:bg-surface-container-high transition-all p-4 flex flex-col justify-between cursor-pointer group" data-tcg-shortcut="onepiece">
                    <img src="category-images/tcg-onepiece.svg" alt="One Piece" class="w-12 h-12" />
                    <p class="font-headline font-black uppercase text-sm group-hover:text-primary transition-colors">One Piece</p>
                </div>
                <div class="aspect-square bg-surface-container hover:bg-surface-container-high transition-all p-4 flex flex-col justify-between cursor-pointer group" data-tcg-shortcut="digimon">
                    <img src="category-images/tcg-digimon.svg" alt="Digimon" class="w-12 h-12" />
                    <p class="font-headline font-black uppercase text-sm group-hover:text-primary transition-colors">Digimon</p>
                </div>
                <div class="aspect-square bg-surface-container hover:bg-surface-container-high transition-all p-4 flex flex-col justify-between cursor-pointer group" data-tcg-shortcut="riftbound">
                    <img src="category-images/tcg-riftbound.svg" alt="Riftbound" class="w-12 h-12" />
                    <p class="font-headline font-black uppercase text-sm group-hover:text-primary transition-colors">Riftbound</p>
                </div>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-6 py-8">
            <div class="filter-container tcg-filter-bar flex flex-wrap gap-2 mb-4">
                <button class="filter-chip filter-chip-active px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="all">Todos</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="pokemon">Pokémon</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="yu-gi-oh">Yu-Gi-Oh!</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="magic">Magic</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="one-piece">One Piece</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="digimon">Digimon</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="riftbound">Riftbound</button>
                <button class="filter-chip px-4 py-2 font-label text-xs uppercase tracking-widest" data-filter="accesorios">Accesorios</button>
            </div>
            <p id="tcgFilterSummary" class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-6">Mostrando todos los productos del Centro TCG.</p>
            <div class="catalog-grid grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </section>
    </main>

    <div id="footer-container"></div>
    <div id="cart-container"></div>
    <div id="whatsapp-container"></div>

    <script src="js/products-data.js?v=20260503-1"></script>
    <script src="js/catalog.js?v=20260509-1"></script>
    <script src="js/cart.js?v=20260509-1"></script>
    <script src="js/ui.js?v=20260509-1"></script>
    <script src="js/supabase-store.js?v=20260509-1"></script>
    <script src="js/components.js?v=20260423-1"></script>
</body>
</html>
